site_name: Prácticas de Machine Learning
site_description: Talleres prácticos de Machine Learning para el curso de Ciencia de Datos
site_author: Juan Pablo Reyes
site_url: https://datascience-uniandes.github.io/PracticasMachineLearning/
repo_url: https://github.com/datascience-uniandes/PracticasMachineLearning
repo_name: datascience-uniandes/PracticasMachineLearning
edit_uri: edit/main/docs/
copyright: Universidad de los Andes · Ciencia de Datos

theme:
  name: material
  language: es
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: amber
      toggle:
        icon: material/weather-night
        name: Modo oscuro
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: amber
      toggle:
        icon: material/weather-sunny
        name: Modo claro
  features:
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - navigation.instant
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - content.action.edit
    - toc.follow
  icon:
    repo: fontawesome/brands/github

plugins:
  - search:
      lang: es

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - footnotes
  - def_list
  - abbr
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

extra_javascript:
  - assets/js/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

extra_css:
  - assets/css/extra.css

nav:
  - Inicio: index.md
  - Talleres:
      - Práctica 1:
          - talleres/practica-1/index.md
          - "Actividad 1: Entendimiento de datos": talleres/practica-1/actividad-1.md
      - Práctica 2: talleres/practica-2.md
      - Práctica 3: talleres/practica-3.md
      - Práctica 4: talleres/practica-4.md
      - Práctica 5: talleres/practica-5.md
  - Ayudas:
      - Cargar un dataset: ayudas/cargar-dataset.md
      - Dimensiones de calidad de los datos: ayudas/dimensiones-calidad.md
      - Explorar la estructura de un dataset: ayudas/explorar-estructura.md
      - Gráfico de barras: ayudas/grafico-barras.md
      - Gráfico de cajas: ayudas/grafico-cajas.md
      - Histograma: ayudas/histograma.md
      - Revisar y tratar duplicados: ayudas/duplicados.md
      - Revisar y tratar inconsistencias: ayudas/inconsistencias.md
      - Revisar y tratar nulos: ayudas/nulos.md
      - Revisar y tratar valores atípicos: ayudas/valores-atipicos.md
      - Revisar y tratar valores inválidos: ayudas/valores-invalidos.md
  - Glosario: glosario.md
